[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zerosieve"
version = "1.0.0"
description = "Zero-key web search for AI agents with a System-1 sieve: batch-filter, rerank and verify evidence locally at 100+ decisions/sec."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "wd041216-bit", email = "wd041216@uw.edu" }
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "urllib3>=1.26.0",
  "beautifulsoup4>=4.9.0",
  "lxml>=4.6.0",
  "ddgs>=0.1.0",
  "mcp>=1.1.2,<2",
  "markdownify>=0.13.1",
]

[project.urls]
Homepage = "https://github.com/wd041216-bit/zerosieve"
Repository = "https://github.com/wd041216-bit/zerosieve"
Issues = "https://github.com/wd041216-bit/zerosieve/issues"
Changelog = "https://github.com/wd041216-bit/zerosieve/blob/main/CHANGELOG.md"
Documentation = "https://github.com/wd041216-bit/zerosieve/tree/main/docs"

[project.scripts]
zs-search = "zerosieve.search_web:main"
zs-browse = "zerosieve.browse_page:main"
zs-verify = "zerosieve.verify_claim:main"
zs-report = "zerosieve.evidence_report:main"
zs-context = "zerosieve.context:main"
zs-mcp = "zerosieve.mcp_server:run"
zs-setup = "zerosieve.provider_setup:main"
# legacy aliases (upstream zero-* names keep working)
zero-search = "zerosieve.search_web:main"
zero-browse = "zerosieve.browse_page:main"
zero-verify = "zerosieve.verify_claim:main"
zero-report = "zerosieve.evidence_report:main"
zero-context = "zerosieve.context:main"
zero-mcp = "zerosieve.mcp_server:run"
zero-setup = "zerosieve.provider_setup:main"
search-web = "zerosieve.search_web:main"
browse-page = "zerosieve.browse_page:main"
verify-claim = "zerosieve.verify_claim:main"
evidence-report = "zerosieve.evidence_report:main"
llm-context = "zerosieve.context:main"
cross-validated-search-mcp = "zerosieve.mcp_server:run"

[project.optional-dependencies]
laya = [
  "laya>=0.3.0",
]
pdf = [
  "pypdf>=4.0.0",
]
dev = [
  "build>=1.2.2",
  "twine>=6.1.0",
  "ruff>=0.4.0",
  "pyright>=1.1.350",
  "coverage>=7.0",
]

[tool.setuptools.packages.find]
include = ["zerosieve*", "zerosieve_compat*"]

[tool.setuptools.package-data]
zerosieve = ["skills/*.md"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = "none"
reportAttributeAccessIssue = "none"

[tool.coverage.run]
source = ["zerosieve"]
omit = [
    "zerosieve/browse_page.py",
    "zerosieve/mcp_server.py",
    "zerosieve/provider_setup.py",
    "zerosieve/providers/brightdata.py",
    "zerosieve/providers/ddgs.py",
    "zerosieve/providers/searxng.py",
    "zerosieve/providers/web_unlocker.py",
    "zerosieve/search_web.py",
    "zerosieve/context.py",
    "zerosieve/verify_claim.py",
    "zerosieve/evidence_report.py",
    "zerosieve/search.py",
]

[tool.coverage.report]
fail_under = 80
